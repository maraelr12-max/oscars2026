<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados Oscars🏆</title>
    <style>
        :root { --gold: #D4AF37; --dark: #0a0a0a; --glass: rgba(255,255,255,0.05); }
        body { background: var(--dark); color: white; font-family: 'Georgia', serif; padding: 20px; text-align: center; }
        .container { max-width: 600px; margin: 0 auto; background: var(--glass); padding: 30px; border-radius: 20px; border: 1px solid var(--gold); }
        h1 { color: var(--gold); letter-spacing: 3px; text-transform: uppercase; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 1.2rem; }
        th { border-bottom: 2px solid var(--gold); padding: 15px; color: var(--gold); text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid #333; }
        .pos-1 { color: var(--gold); font-weight: bold; font-size: 1.5rem; }
        .puntos { font-weight: bold; color: #fff; }
        .loading { color: var(--gold); font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏆 Tabla de Posiciones Final</h1>
    <p style="color: #999;">Resultados</p>
    
    <div id="loading" class="loading">Calculando votos...</div>
    
    <table id="tabla-resultados" style="display:none;">
        <thead>
            <tr>
                <th>Lugar</th>
                <th>Nombre</th>
                <th>Aciertos</th>
            </tr>
        </thead>
        <tbody id="body-resultados"></tbody>
    </table>
</div>

<script>
    // 1. URL DE TU EXCEL (Publicar como CSV)
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQhTN5cI2dGymnpFhGpvuPCwdDavJkJEG4u44ox5qKddNjIOHUYm2VioQILnudoQey1jK3Iu6RNXucX/pub?output=csv";

    // 2. GANADORES REALES
    const ganadoresOficiales = [
        "One Battle After Another",           // Mejor Película
        "Jessie Buckley - Hamnet",            // Mejor Actriz
        "Michael B. Jordan - Sinners",        // Mejor Actor
        "Amy Madigan - Weapons",              // Mejor Actriz Reparto
        "Sean Penn - One Battle After Another", // Mejor Actor Reparto
        "Paul Thomas Anderson - One Battle After Another", // Mejor Dirección
        "Sinners",                            // Guion Original
        "One Battle After Another",           // Guion Adaptado
        "Golden - KPop Demon Hunters",        // Canción
        "Sinners",                            // Banda Sonora
        "Sentimental Value (Noruega)",        // Película Internacional
        "KPop Demon Hunters",                 // Animación
        "Mr. Nobody Against Putin",           // Documental
        "Frankenstein",                       // Diseño Producción
        "Frankenstein",                       // Maquillaje
        "Frankenstein",                       // Vestuario
        "F1",                                 // Sonido
        "One Battle After Another",           // Edición
        "Sinners",                            // Fotografía
        "Avatar: Fire and Ash",               // Efectos Visuales
        ["The Singers", "Two People Exchanging Saliva"], // Corto Ficción
        "All the Empty Rooms",                // Corto Doc
        "One Battle After Another",           // Casting
        "The Girl Who Cried Pearls"           // Corto Animado
    ];

<script>
    // 1. VERIFICA QUE ESTA URL TERMINE EN output=csv
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQhTN5cI2dGymnpFhGpvuPCwdDavJkJEG4u44ox5qKddNjIOHUYm2VioQILnudoQey1jK3Iu6RNXucX/pub?output=csv";

    // 2. GANADORES (Ajustados exactamente a lo que se ve en tu foto del Excel)
    const ganadoresOficiales = [
        "One Battle After Another",           // Mejor Película
        "Jessie Buckley - Hamnet",            // Mejor Actriz
        "Michael B. Jordan - Sinners",        // Mejor Actor
        "Amy Madigan - Weapons",              // Mejor Actriz Reparto
        "Sean Penn - One Battle After Another", // Mejor Actor Reparto
        "Paul Thomas Anderson - One Battle After Another", // Mejor Dirección
        "Sinners",                            // Guion Original
        "One Battle After Another",           // Guion Adaptado
        "Golden - KPop Demon Hunters",        // Canción
        "Sinners",                            // Banda Sonora
        "Sentimental Value (Noruega)",        // Película Internacional
        "KPop Demon Hunters",                 // Animación
        "Mr. Nobody Against Putin",           // Documental
        "Frankenstein",                       // Diseño Producción
        "Frankenstein",                       // Maquillaje
        "Frankenstein",                       // Vestuario
        "F1",                                 // Sonido
        "One Battle After Another",           // Edición
        "Sinners",                            // Fotografía
        "Avatar: Fire and Ash",               // Efectos Visuales
        ["The Singers", "Two People Exchanging Saliva"], // Corto Ficción (Empate)
        "All the Empty Rooms",                // Corto Doc
        "One Battle After Another",           // Casting
        "The Girl Who Cried Pearls"           // Corto Animado
    ];

    async function procesarResultados() {
        try {
            const response = await fetch(CSV_URL + "&cb=" + Date.now());
            const csvText = await response.text();
            
            // Dividimos por filas y limpiamos espacios vacíos al final
            const filas = csvText.split(/\r?\n/).filter(f => f.trim() !== "").slice(1);
            
            let participantes = [];

            filas.forEach(fila => {
                // Esta expresión regular separa por comas respetando las que están dentro de comillas
                const columnas = fila.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                
                if (columnas.length < 3) return;

                // Limpiamos comillas y espacios de cada celda
                const limpiar = (texto) => texto ? texto.replace(/^["']|["']$/g, '').trim() : "";
                
                const nombre = limpiar(columnas[1]);
                let aciertos = 0;

                ganadoresOficiales.forEach((ganador, i) => {
                    const votoUsuario = limpiar(columnas[i + 2]);
                    
                    if (Array.isArray(ganador)) {
                        // Caso de empate (Corto Ficción)
                        if (ganador.some(g => g.toLowerCase() === votoUsuario.toLowerCase())) aciertos++;
                    } else {
                        // Comparación normal (sin importar mayúsculas/minúsculas)
                        if (votoUsuario.toLowerCase() === ganador.toLowerCase()) aciertos++;
                    }
                });

                participantes.push({ nombre, aciertos });
            });

            // Ordenamos: primero por aciertos, luego por nombre
            participantes.sort((a, b) => b.aciertos - a.aciertos);

            const body = document.getElementById('body-resultados');
            body.innerHTML = "";
            
            participantes.forEach((p, index) => {
                const esGanador = index === 0 ? "pos-1" : "";
                body.innerHTML += `
                    <tr class="${esGanador}">
                        <td>${index + 1}°</td>
                        <td>${p.nombre}</td>
                        <td class="puntos">${p.aciertos}</td>
                    </tr>`;
            });

            document.getElementById('loading').style.display = "none";
            document.getElementById('tabla-resultados').style.display = "table";

        } catch (error) {
            console.error(error);
            document.getElementById('loading').innerText = "Error: Verifica que el Excel esté publicado como CSV.";
        }
    }

    procesarResultados();
</script>
</body>
</html>
