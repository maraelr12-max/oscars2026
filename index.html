<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modo Diagnóstico</title>
    <style>
        body { background: #111; color: white; font-family: sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #222;}
        th, td { border: 1px solid #444; padding: 10px; text-align: left; }
        th { background: #333; color: gold; text-transform: uppercase; }
        .yes { color: #0f0; font-weight: bold; }
        .no { color: #f55; }
    </style>
</head>
<body>
    <h2 style="color: gold;">🔍 Escáner de Votos - Oscars 2026</h2>
    <p>Revisa la tabla de la persona ganadora. Busca la categoría donde debería tener punto pero sale una "❌".</p>
    <div id="debug-area" style="color: #888; font-style: italic;">Cargando datos del Excel...</div>

    <script>
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQhTN5cI2dGymnpFhGpvuPCwdDavJkJEG4u44ox5qKddNjIOHUYm2VioQILnudoQey1jK3Iu6RNXucX/pub?output=csv";

        const ganadoresOficiales = [
            "One Battle After Another",                           
            "Jessie Buckley - Hamnet",                            
            "Michael B. Jordan - Sinners",                        
            "Amy Madigan - Weapons",                              
            "Sean Penn - One Battle After Another",               
            "Paul Thomas Anderson - One Battle After Another",    
            "Sinners",                                            
            "One Battle After Another",                           
            "Golden - KPop Demon Hunters",                        
            "Sinners",                                            
            "Sentimental Value (Noruega)",                        
            "KPop Demon Hunters",                                 
            "Mr. Nobody Against Putin",                           
            "Frankenstein",                                       
            "Frankenstein",                                       
            "Frankenstein",                                       
            "F1",                                                 
            "One Battle After Another",                           
            "Sinners",                                            
            "Avatar: Fire and Ash",                               
            ["The Singers", "Two People Exchanging Saliva"],
            "All the Empty Rooms",                                
            "One Battle After Another",                           
            "The Girl Who Cried Pearls"                           
        ];

        const categorias = [
            "1. Película", "2. Actriz", "3. Actor", "4. Actriz Reparto", "5. Actor Reparto", "6. Dirección", 
            "7. Guion Orig", "8. Guion Adapt", "9. Canción", "10. Banda Sonora", "11. Internacional", "12. Animación", 
            "13. Documental", "14. Diseño Prod", "15. Maquillaje", "16. Vestuario", "17. Sonido", "18. Edición", "19. Fotografía", 
            "20. Efectos", "21. Corto Ficción", "22. Corto Doc", "23. Casting", "24. Corto Animado"
        ];

        function esAcierto(voto, ganador) {
            if (!voto || !ganador) return false;
            const modoExtremo = (str) => str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
            let vLimpiado = modoExtremo(voto);
            if (!vLimpiado) return false;

            if (Array.isArray(ganador)) {
                return ganador.some(g => {
                    let gLimpiado = modoExtremo(g);
                    return vLimpiado.includes(gLimpiado) || gLimpiado.includes(vLimpiado);
                });
            } else {
                let gLimpiado = modoExtremo(ganador);
                return vLimpiado.includes(gLimpiado) || gLimpiado.includes(vLimpiado);
            }
        }

        async function checar() {
            try {
                const res = await fetch(CSV_URL + "&cb=" + Date.now());
                const txt = await res.text();
                const filas = txt.split(/\r?\n/).filter(f => f.trim() !== "").slice(1);
                
                let html = "";

                filas.forEach(fila => {
                    const columnas = fila.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    if(columnas.length < 5) return;

                    let nombre = columnas[1].replace(/^["']|["']$/g, '').trim();
                    let aciertos = 0;
                    let tablaFilas = "";

                    ganadoresOficiales.forEach((gan, idx) => {
                        let voto = columnas[idx + 2] ? columnas[idx + 2].replace(/^["']|["']$/g, '').trim() : "(En blanco)";
                        let punto = esAcierto(voto, gan);
                        if(punto) aciertos++;

                        let ganStr = Array.isArray(gan) ? gan.join(" -O- ") : gan;
                        let icono = punto ? "<span class='yes'>✅ SÍ</span>" : "<span class='no'>❌ NO</span>";

                        tablaFilas += `<tr><td>${categorias[idx]}</td><td>${ganStr}</td><td>${voto}</td><td>${icono}</td></tr>`;
                    });

                    html += `<h3 style="color: gold; margin-top:50px; border-bottom: 2px solid gold;">👤 ${nombre} - Puntos Totales: ${aciertos}</h3>`;
                    html += `<table><tr><th>Categoría</th><th>Lo que busca el sistema</th><th>Lo que está en el Excel</th><th>¿Sumó Punto?</th></tr>${tablaFilas}</table>`;
                });

                document.getElementById('debug-area').innerHTML = html;

            } catch(e) {
                document.getElementById('debug-area').innerText = "Error leyendo el CSV.";
            }
        }
        checar();
    </script>
</body>
</html>
