<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oscars 2026 - Experience 🎬</title>
    <style>
        :root {
            --midnight: #0a0e1a;
            --gold-light: #f3e5ab;
            --gold-dark: #c5a059;
            --accent: #1e2a44;
        }

        body {
            background: linear-gradient(135deg, var(--midnight) 0%, #161b22 100%);
            color: #e6e6e6;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Encabezado Estilo Art Déco */
        header {
            text-align: center;
            padding: 60px 20px;
            border: 2px solid var(--gold-dark);
            margin-bottom: 50px;
            background: rgba(0,0,0,0.3);
            position: relative;
        }

        header h1 {
            font-family: 'serif';
            font-size: 3.5rem;
            margin: 0;
            color: var(--gold-light);
            letter-spacing: 8px;
            text-shadow: 2px 2px 0px var(--gold-dark);
        }

        .input-section {
            text-align: center;
            margin-bottom: 40px;
        }

        input[type="text"] {
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--gold-dark);
            color: var(--gold-light);
            padding: 15px;
            font-size: 1.2rem;
            width: 60%;
            text-align: center;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            border-bottom-color: var(--gold-light);
            width: 70%;
        }

        /* Tarjetas de Categoría Modernas */
        .categoria-card {
            background: var(--accent);
            margin-bottom: 25px;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .categoria-titulo {
            background: var(--gold-dark);
            color: var(--midnight);
            padding: 15px 25px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1rem;
        }

        .nominados-list {
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn-nom {
            flex: 1 1 calc(50% - 10px);
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(197, 160, 89, 0.3);
            color: #ccc;
            padding: 15px;
            cursor: pointer;
            text-align: left;
            transition: 0.3s;
            font-size: 0.9rem;
        }

        .btn-nom:hover {
            background: rgba(197, 160, 89, 0.1);
            border-color: var(--gold-light);
        }

        .selected {
            background: var(--gold-light) !important;
            color: var(--midnight) !important;
            font-weight: bold;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }

        /* Botón de Envío */
        .footer-action {
            position: sticky;
            bottom: 20px;
            padding: 20px 0;
        }

        .btn-final {
            width: 100%;
            background: var(--gold-dark);
            color: var(--midnight);
            border: none;
            padding: 25px;
            font-size: 1.4rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,0,0,0.6);
            transition: 0.4s;
        }

        .btn-final:hover {
            background: var(--gold-light);
            transform: translateY(-3px);
        }

        @media (max-width: 600px) {
            .btn-nom { flex: 1 1 100%; }
            header h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>OSCARS MMXXVI</h1>
    </header>

    <div class="input-section">
        <input type="text" id="user-name" placeholder="NOMBRE DEL INVITADO">
    </div>

    <div id="dynamic-grid"></div>

    <div class="footer-action">
        <button class="btn-final" id="main-submit" onclick="submitVotes()">Cerrar Pronósticos</button>
    </div>
</div>

<script>
    // --- RECUERDA PONER TU URL DE APPS SCRIPT ---
    const SCRIPT_URL = "TU_URL_DE_APPS_SCRIPT_AQUI";

    const data = [
        { id: "c1", t: "Mejor Película", n: ["Bugonia", "F1", "Frankenstein", "Hamnet", "Marty Supreme", "One Battle After Another", "O Agente Secreto", "Sentimental Value", "Sinners", "Train Dreams"] },
        { id: "c2", t: "Mejor Actriz Protagonista", n: ["Jessie Buckley", "Rose Byrne", "Kate Hudson", "Renate Reinsve", "Emma Stone"] },
        { id: "c3", t: "Mejor Actor Protagonista", n: ["Timothée Chalamet", "Leonardo DiCaprio", "Ethan Hawke", "Michael B. Jordan", "Wagner Moura"] },
        { id: "c4", t: "Mejor Actriz de Reparto", n: ["Elle Fanning", "Inga Ibsdotter Lilleaas", "Amy Madigan", "Wunmi Mosaku", "Teyana Taylor"] },
        { id: "c5", t: "Mejor Actor de Reparto", n: ["Benicio del Toro", "Jacob Elordi", "Delroy Lindo", "Sean Penn", "Stellan Skarsgård"] },
        { id: "c6", t: "Mejor Dirección", n: ["Chloé Zhao", "Josh Safdie", "Paul Thomas Anderson", "Joachim Trier", "Ryan Coogler"] },
        { id: "c7", t: "Mejor Guion Original", n: ["Blue Moon", "It Was Just an Accident", "Marty Supreme", "Sentimental Value", "Sinners"] },
        { id: "c8", t: "Mejor Guion Adaptado", n: ["Bugonia", "Frankenstein", "Hamnet", "One Battle After Another", "Train Dreams"] },
        { id: "c9", t: "Mejor Canción Original", n: ["Dear Me", "Golden", "I Lied to You", "Sweet Dreams of Joy", "Train Dreams"] },
        { id: "c10", t: "Mejor Banda Sonora Original", n: ["Bugonia", "Frankenstein", "Hamnet", "One Battle After Another", "Sinners"] },
        { id: "c11", t: "Mejor Película Internacional", n: ["O Agente Secreto", "It Was Just an Accident", "Sentimental Value", "Sirat: Trance en el desierto", "The Voice of Hind Rajab"] },
        { id: "c12", t: "Mejor Película de Animación", n: ["Arco", "Elio", "KPop Demon Hunters", "Little Amélie", "Zootopia 2"] },
        { id: "c13", t: "Mejor Película Documental", n: ["The Alabama Solution", "Come See Me in the Good Light", "Cutting Through Rocks", "Mr. Nobody Against Putin", "The Perfect Neighbor"] },
        { id: "c14", t: "Mejor Diseño de Producción", n: ["Frankenstein", "Hamnet", "Marty Supreme", "One Battle After Another", "Sinners"] },
        { id: "c15", t: "Mejor Maquillaje y Peluquería", n: ["Frankenstein", "Kokuho", "Sinners", "The Smashing Machine", "The Ugly Stepsister"] },
        { id: "c16", t: "Mejor Diseño de Vestuario", n: ["Avatar: Fire and Ash", "Frankenstein", "Hamnet", "Marty Supreme", "Sinners"] },
        { id: "c17", t: "Mejor Sonido", n: ["F1", "Frankenstein", "One Battle After Another", "Sinners", "Sirāt: trance en el desierto"] },
        { id: "c18", t: "Mejor Edición", n: ["F1", "Marty Supreme", "One Battle After Another", "Sentimental Value", "Sinners"] },
        { id: "c19", t: "Mejor Fotografía", n: ["Frankenstein", "Marty Supreme", "One Battle After Another", "Sinners", "Train Dreams"] },
        { id: "c20", t: "Mejores Efectos Visuales", n: ["Avatar: Fire and Ash", "F1", "Jurassic World Rebirth", "The Lost Bus", "Sinners"] },
        { id: "c21", t: "Mejor Cortometraje de Ficción", n: ["Butcher's Stain", "A Friend of Dorothy", "Jane Austen's Period Drama", "The Singers", "Two People Exchanging Saliva"] },
        { id: "c22", t: "Mejor Cortometraje Documental", n: ["All the Empty Rooms", "Armed Only With a Camera", "Children No More", "The Devil Is Busy", "Perfectly a Strangeness"] },
        { id: "c23", t: "Mejor Casting", n: ["Hamnet", "Marty Supreme", "O Agente Secreto", "One Battle After Another", "Sinners"] },
        { id: "c24", t: "Mejor Cortometraje Animado", n: ["Butterfly", "Forevergreen", "The Girl Who Cried Pearls", "Retirement Plan", "The Three Sisters"] }
    ];

    let selections = {};

    function init() {
        const grid = document.getElementById('dynamic-grid');
        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'categoria-card';
            card.innerHTML = `
                <div class="categoria-titulo">${item.t}</div>
                <div class="nominados-list">
                    ${item.n.map(nom => `<button class="btn-nom" onclick="pick('${item.id}', '${nom}', this)">${nom}</button>`).join('')}
                </div>`;
            grid.appendChild(card);
        });
    }

    function pick(id, val, el) {
        selections[id] = val;
        Array.from(el.parentElement.children).forEach(b => b.classList.remove('selected'));
        el.classList.add('selected');
    }

    async function submitVotes() {
        const name = document.getElementById('user-name').value.trim();
        if(!name || Object.keys(selections).length < 24) return alert("Faltan datos");

        document.getElementById('main-submit').disabled = true;
        const payload = { nombre: name, votos: data.map(i => selections[i.id]) };

        try {
            await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
            alert("Votos enviados a la gala");
            location.reload();
        } catch(e) { alert("Error"); document.getElementById('main-submit').disabled = false; }
    }

    init();
</script>
</body>
</html>
